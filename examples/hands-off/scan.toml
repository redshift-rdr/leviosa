# All built-in modules, once each. See README.md before the first run.
# Required application inputs are deliberately not bundled as live credentials.
name = "hands-off-application-review"
target = "inputs/requests.json"
database = "traffic.sqlite"
results = "results.jsonl"
on_error = "continue"

# Pause between modules (seconds). Replace with both range settings to randomize.
module_delay = 5.0
# module_delay_min = 3.0
# module_delay_max = 8.0

# Pace the Repeater preview, then continue with each module's native category.
human_mode = true
human_timing_min = 2.0
human_timing_max = 4.0
random_timing = false
concurrency = 1
repeater_preview = 5

# No interactive credential refresh in this unattended profile.
auth_check = false
# Explicit --burp / --proxy-config can still override these defaults.
burp = false
no_proxy = false
follow_redirects = false
timeout = 15
max_body_bytes = 262144

# Most active steps sample a few seed requests, not generated probes.
# JWT/upload/IDOR retain all applicable seeds so sampling cannot hide them.
# All steps except authentication exclude login/account-management paths and
# obvious destructive actions. These are input filters, not a safety boundary.

[[steps]]
name = "Baseline replay of read requests"
module = "passthrough"
filters = { methods = ["GET", "HEAD"], path = '(?i)^(?!.*(?:^|/)(?:login|signin|sign-in|sign_in|authenticate|authentication|auth|oauth2?|sessions?|logout|signout|sign-out|register|signup|sign-up|(?:forgot|reset|change)[_-]?password|password(?:[_-](?:reset|change))?|mfa|otp|delete|remove|destroy|purge|checkout|payments?|pay|transfer|refund)(?:[/.]|$)).*', sample = 40, sample_seed = 27 }

[[steps]]
name = "Login page audits; no credential submissions or guessing"
module = "authentication"

[[steps]]
name = "All HTTP security headers"
module = "securityheaders"
filters = { methods = ["GET", "HEAD"], path = '(?i)^(?!.*(?:^|/)(?:login|signin|sign-in|sign_in|authenticate|authentication|auth|oauth2?|sessions?|logout|signout|sign-out|register|signup|sign-up|(?:forgot|reset|change)[_-]?password|password(?:[_-](?:reset|change))?|mfa|otp|delete|remove|destroy|purge|checkout|payments?|pay|transfer|refund)(?:[/.]|$)).*', sample = 40, sample_seed = 27 }

